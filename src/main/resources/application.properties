spring.application.name=mock-server
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
server.port=${SERVER_PORT:8081}
batch.max-accounts=${BATCH_MAX_ACCOUNTS:100000}
pricing-engine.wake-up-url=${PRICING_ENGINE_WAKE_UP_URL:http://localhost:8082/api/v1/work-available}
pricing-engine.max-attempts=${PRICING_ENGINE_MAX_ATTEMPTS:3}
pricing-engine.http-timeout=${PRICING_ENGINE_HTTP_TIMEOUT:2s}
pricing-engine.retry-delay=${PRICING_ENGINE_RETRY_DELAY:1s}
springdoc.api-docs.version=OPENAPI_3_0
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.url=/openapi.yaml
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/accountdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:accountuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:accountpass}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
