spring.application.name=mock-server
server.port=${SERVER_PORT:8081}
springdoc.api-docs.version=OPENAPI_3_0
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.url=/openapi.yaml
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/accountdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:accountuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:accountpass}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
