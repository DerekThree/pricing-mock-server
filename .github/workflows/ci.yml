name: Mock-Server CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v5

      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Run mock-server tests and build
        run: |
          chmod +x ./mvnw
          ./mvnw clean verify

      - name: Build Docker image
        run: docker build -t pricing-mock-server:ci .
        
      - name: Export verified Docker image
        if: github.event_name == 'push'
        run: docker save pricing-mock-server:ci -o pricing-mock-server-image.tar

      - name: Upload Docker image artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: pricing-mock-server-image
          path: pricing-mock-server-image.tar
          if-no-files-found: error
          retention-days: 1
